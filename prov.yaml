title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
identity: lazy
fixity: attachments
recycle_bin: true
history: off
about: structure
workspace_id: plates
relations:
  front_page:
    means: the page that greets a reader of this audience
    cardinality: one
    inverse: fronts
  fronts:
    means: audiences this document greets
    cardinality: many
    inverse: front_page
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
  status:
  - under: '[[Tasks]]'
    values: closed
    vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
    default: open
  - under: '[[Proposals]]'
    values: closed
    vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
    default: draft
  created:
    stamp: create
  updated:
    stamp: edit
exports:
  docs:
    label: plates
    gate:
      field: audience
      value: public
views:
  open-tasks:
    label: Open tasks
    where: under('[[Tasks]]') && present(status) && !(status in ['done', 'dropped'])
    key: status
  proposals:
    label: Proposals
    where: under('[[Proposals]]') && present(status)
    key: status
  work:
    label: All work
    where: present(status)
    key: status
root: README.md
