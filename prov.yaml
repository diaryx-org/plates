title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
updated: updated
identity: lazy
fixity: attachments
recycle_bin: true
history: off
about: structure
workspace_id: plates
relations:
  front_page:
    means: the page that greets a reader of this audience
    cardinality: one
    inverse: fronts
  fronts:
    means: audiences this document greets
    cardinality: many
    inverse: front_page
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  status:
  - under: '[[Tasks]]'
    values: closed
    vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
    default: open
  - under: '[[Proposals]]'
    values: closed
    vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
    default: draft
  created:
    type: datetime
  updated:
    type: datetime
exports:
  docs:
    label: plates
    gate:
      field: audience
      value: public
created: created
views:
  open-tasks:
    label: Open tasks
    group: status
    under: '[[Tasks]]'
    where:
      not:
        equals: { status: [done, dropped] }
  proposals:
    label: Proposals
    group: status
    under: '[[Proposals]]'
    where: { has: status }
  work:
    label: All work
    group: status
    where: { has: status }
root: README.md
