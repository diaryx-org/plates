name: Publish
# Publish the workspace crates to crates.io on a version tag. `dx release
# <spec> --push` cuts the tag and the GitHub release; this is the registry half,
# and before it existed that half was a `cargo publish --workspace` run by hand.
#
# As in ci.yml, this file holds no knowledge of the workspace: which crates go up
# and in what order is `cargo publish --workspace`, which reads both off the
# manifests — `xtask` is `publish = false` and skipped, and plates-render,
# plates, and plates-cli go up in dependency order, waiting on the index between
# them. A crate added to the workspace is published by the next tag with no edit
# here.
#
# Nothing skips a version already on the index. A re-run of a tag that fully
# published fails on the first crate, and a run that died partway is finished by
# naming what already went up:
#
#     cargo publish --workspace --exclude plates-render
#
# which is a `workflow_dispatch` of this file with that line edited in, or the
# same command from a checkout of the tag.
#
# Zig, as in ci.yml: `cargo publish` runs a verification build, and `fig` and
# `twig` reach this workspace through prov with a `build.rs` that runs `zig
# build`, so the pinned toolchain must be on PATH.
#
# Auth is the `CARGO_REGISTRY_TOKEN` secret, as in fig, twig, moid, and prov —
# one token for every crate, not Trusted Publishing, for the reason prov's
# publish.yml gives. It must carry `publish-update` for the crates that exist and
# `publish-new` for any the workspace has yet to publish. Rotating is `gh secret
# set CARGO_REGISTRY_TOKEN` and nothing here changes.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: mlugg/setup-zig@v2
      with: { version: "0.16.0" }
    - uses: Swatinem/rust-cache@v2

    # On a tag, the tag must name the version being published — refuse a
    # mismatch rather than publish a surprise. (workflow_dispatch has no tag, so
    # the guard is skipped there.)
    - name: Check the tag against the workspace version
      if: github.ref_type == 'tag'
      run: |
        version=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.name == "plates") | .version')
        echo "Workspace version: $version"
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
          exit 1
        fi

    - name: Publish every publishable crate, in dependency order
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --workspace
