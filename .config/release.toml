# What the shared release tooling needs to know about plates. Everything not
# stated here is a default in lib/repo.nu — the manifest, the changelog path,
# the cliff config, and that this is a Cargo workspace.
name = "plates"
url = "https://github.com/diaryx-org/plates"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# What pushing the tag sets off. The warning printed before the push is handed
# back to you is composed from this. The GitHub release is still cut by
# `release` itself, from the machine that pushed the tag.
[[tag_starts]]
workflow = "publish.yml"
does = "uploads every publishable crate to crates.io"
